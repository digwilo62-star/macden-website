<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — MACDEN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    <div id="navbar" style="display:none;"></div>

    <!-- TOP BAR -->
    <header class="dash-topbar">
        <div class="dash-topbar-left">
            <button class="dash-home-btn"
                onclick="window.location='index.html'">
                &larr; Home
            </button>
            <div class="dash-logo">
                <img src="images/logo.jpeg" alt="MACDEN" />
                <span>MACDEN</span>
            </div>
            <span class="admin-badge">BUYER</span>
        </div>
        <div class="dash-topbar-right">
            <div class="dash-user-pill">
                <div class="dash-user-avatar">A</div>
                <span class="dash-user-name">Adebayo</span>
            </div>
            <button class="dash-logout-btn"
                onclick="window.location='login.html'">
                Logout
            </button>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <section class="dash-header">
        <div class="dash-header-left">
            <h1 class="dash-title">Today's prices.</h1>
            <p class="dash-subtitle">
                Browse, filter, and select products.
                Download your list anytime.
            </p>
        </div>
        <div class="dash-header-right">
            <button class="btn primary dash-download-btn"
                id="download-full-btn">
                Download Full List (PDF)
            </button>
        </div>
    </section>

    <!-- SEARCH BAR -->
    <section class="dash-search-section">
        <div class="dash-search-wrap">
            <input type="text"
                id="dash-search"
                class="dash-search-input"
                placeholder="Search by product name..." />
        </div>
    </section>

    <!-- FILTER CHIPS -->
    <section class="dash-filter-section">
        <div class="dash-filter-wrap">
            <button class="dash-chip active"
                data-category="all">All</button>
            <button class="dash-chip"
                data-category="wines">Wines</button>
            <button class="dash-chip"
                data-category="spirits">Spirits</button>
            <button class="dash-chip"
                data-category="bitters">Bitters</button>
            <button class="dash-chip"
                data-category="beer-stout">Beer & Stout</button>
            <button class="dash-chip"
                data-category="malt-drinks">Malt Drinks</button>
            <button class="dash-chip"
                data-category="rtd-energy">RTD & Energy</button>
        </div>
        <p class="dash-product-count" id="dash-product-count"></p>
    </section>

    <!-- PRODUCT GRID -->
    <section class="dash-products-section">
        <div class="dash-products-wrap">
            <p id="dash-loading" class="dash-loading">
                Loading products...
            </p>
            <p id="dash-empty" class="dash-empty" hidden>
                No products found.
            </p>
            <div id="dash-grid" class="dash-grid"></div>
        </div>
    </section>

    <!-- SELECTION BAR -->
    <div class="dash-selection-bar" id="dash-selection-bar">
        <p class="dash-selection-count">
            <span id="dash-selected-count">0</span>
            products selected
        </p>
        <div class="dash-selection-actions">
            <button class="dash-clear-btn"
                id="dash-clear-btn">
                Clear
            </button>
            <button class="btn primary"
                id="download-selection-btn">
                Download Selection (PDF)
            </button>
        </div>
    </div>

    <!-- FLOATING CHAT BUTTON -->
    <div class="dash-chat-fab" id="dash-chat-fab"
        onclick="window.open('https://wa.me/2348000000000', '_blank')">
        <svg width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5
                a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z">
            </path>
        </svg>
    </div>

    <div id="footer" style="display:none;"></div>

    <script src="js/products.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
