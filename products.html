<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — MACDEN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <!-- PAGE HEADER -->
    <section class="page-header">
        <div class="page-header-container">
            <p class="page-tag">CATALOGUE</p>
            <h1 class="page-title">
                Browse our full product range
            </h1>
            <p class="page-subtitle">
                Sign in to unlock live regional pricing
                for your area.
            </p>
        </div>
    </section>

    <!-- SEARCH + FILTER BAR -->
    <section class="products-controls">
        <div class="products-controls-container">

            <!-- Search -->
            <div class="products-search-wrap">
                <svg class="products-search-icon"
                    viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21"
                        x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text"
                    id="products-search"
                    class="products-search-input"
                    placeholder="Search products..." />
                <button class="products-search-clear"
                    id="search-clear-btn"
                    style="display:none;">
                    &#10005;
                </button>
            </div>

            <!-- Filter chips -->
            <div class="filter-container" id="filter-container">
                <button type="button"
                    class="filter-chip active"
                    data-category="all">
                    All
                </button>
                <button type="button"
                    class="filter-chip"
                    data-category="wines">
                    Wines
                </button>
                <button type="button"
                    class="filter-chip"
                    data-category="spirits">
                    Spirits
                </button>
                <button type="button"
                    class="filter-chip"
                    data-category="bitters">
                    Bitters
                </button>
                <button type="button"
                    class="filter-chip"
                    data-category="beer-stout">
                    Beer & Stout
                </button>
                <button type="button"
                    class="filter-chip"
                    data-category="malt-drinks">
                    Malt Drinks
                </button>
                <button type="button"
                    class="filter-chip"
                    data-category="rtd-energy">
                    RTD & Energy
                </button>
            </div>

            <!-- Product count -->
            <p class="products-count"
                id="products-count"></p>

        </div>
    </section>

    <!-- PRODUCT GRID -->
    <section class="products-section">
        <div class="products-section-container">

            <p id="products-loading"
                class="products-loading">
                Loading products...
            </p>

            <div id="products-grid"
                class="products-grid"></div>

            <!-- Empty state -->
            <div id="products-empty"
                class="products-empty-state"
                hidden>
                <p class="products-empty-title">
                    No products found.
                </p>
                <p class="products-empty-sub">
                    Try a different search term
                    or clear the filter.
                </p>
                <button class="btn primary"
                    id="empty-clear-btn">
                    Clear search
                </button>
            </div>

        </div>
    </section>

    <!-- STICKY CTA STRIP -->
    <div class="products-cta-strip">
        <div class="products-cta-inner">
            <p class="products-cta-text">
                <span class="products-cta-lock">
                    &#128274;
                </span>
                Prices are available to
                registered buyers only.
            </p>
            <div class="products-cta-buttons">
                <button class="btn primary products-cta-btn"
                    onclick="window.location='login.html'">
                    Login
                </button>
                <button class="products-cta-outline"
                    onclick="window.location='register.html'">
                    Create free account
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script src="js/products.js"></script>
    <script src="js/products-page.js"></script>
    <script src="js/web.js"></script>

</body>
</html>
