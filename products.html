<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACDEN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--nav will load here -->
    <div id="navbar"></div>

     <!--Page content-->
        <section class="page-header fade-in">
            <div class="page-header-container">

                <!-- small upper case label above the title-->
            <p class="page-tag">CATALOGUE</p>
            
            <!-- Main page heading-->
             <h1 class="page-title">Browse our full product range</h1>

            <!-- subtitle within links to sign in or request buyer access-->
            <p class="page-subtitle">
              Live regional pricing is reserved for verified buyers.
            <a href="login.html" class="inline-link">Sign in</a> or
            <a href="request-access.html" class="inline-link">create account</a>
            to view prices.    
            </p>  

            </div>

        </section>

        <!------ CATEGORY FILTER---------->
        <!----Pill button that filter the product grid by-------->
        <!----- category. The "ALL" Chip is active by default----------->
        <!---- Each button carries a data-category attribute that------------>
        <!--- matches the category key in our product data.------------->
        <!--- The filter logic gets wired up in js later.------------->
        <section class="filter-section">
           <div class="filter-container">

        <button type="button" class="filter-chip active" data-category="all">
            All
        </button>

        <button type="button" class="filter-chip" data-category="wines">
            Wines
        </button>

        <button type="button" class="filter-chip" data-category="spirits">
            Spirits
        </button>

        <button type="button" class="filter-chip" data-category="bitters">
            Bitters
        </button>

        <button type="button" class="filter-chip" data-category="beer-stout">
            Beer &amp; Stout
        </button>

        <button type="button" class="filter-chip" data-category="malt-drinks">
            Malt Drinks
        </button>

        <button type="button" class="filter-chip" data-category="rtd-energy">
            RTD &amp; Energy
        </button>

           </div> 
        </section>

        <!-------------------------------------------
        
        <--PRODUCT GRID
        <--The grid that holds all product cards.
        <--
        <-- States this section can be in :
        <-- 1. Loading - shown until products.js
        <-- 2. Filled - cards rendered into #products-grid
        <-- 3. Empty - shown if a filter has zero matches
        <============================================== -->
        
        <section class="products-section">
            <div class="products-section-container">

                <!-- Loading states - visible until js replaces it -->
                 <p id="products-loading" class="products-loading">
                    Loading products... 
                 </p>

                <!-- Grid population by products.js with card markup--> 
                <div id="products-grid" class="products-grid">
                    <!-- Product cards inserted here by javaScript-->
                </div>

        <!--- Empty state- shown when a filter has no matches -------->
            <p id="products-empty" class="products-empty" hidden>
                No products match your filter .
            </p>

            </div>
        </section>

        <!-- FOOTER -->
        <div id="footer"></div>



        <script src="js/products.js"></script>
        <script src="js/products-page.js"></script>
    <script src="js/web.js"></script>
</body>
</html>
