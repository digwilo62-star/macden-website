<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — MACDEN Portal</title>
  <link rel="stylesheet" href="assets/portal-style.css">
  <link rel="stylesheet" href="assets/portal-shell.css">
  <link rel="stylesheet" href="assets/search.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpeg" alt="MACDEN">
        <span>MACDEN</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link active"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
        <a href="inbox.html" class="sidebar-link"><i class="ti ti-mail"></i> Inbox <span class="badge" id="unreadBadge" style="display:none;">0</span></a>
        <a href="compose.html" class="sidebar-link"><i class="ti ti-pencil"></i> Compose</a>
        <a href="broadcasts.html" class="sidebar-link"><i class="ti ti-speakerphone"></i> Broadcasts</a>
        <a href="directory.html" class="sidebar-link"><i class="ti ti-users"></i> Directory</a>
        <a href="leave.html" class="sidebar-link"><i class="ti ti-calendar-event"></i> Leave &amp; Requests</a>
        <a href="documents.html" class="sidebar-link"><i class="ti ti-file-text"></i> Documents</a>
        <a href="policies.html" class="sidebar-link"><i class="ti ti-book"></i> Policies</a>
        <a href="attendance.html" class="sidebar-link"><i class="ti ti-clock"></i> Attendance</a>
        <a href="settings.html" class="sidebar-link"><i class="ti ti-settings"></i> Settings</a>
      </nav>
      <div class="sidebar-logout">
        <a href="help.html" class="sidebar-link" style="margin-bottom:6px;"><i class="ti ti-help-circle"></i> Help</a>
        <button id="logoutBtn"><i class="ti ti-logout"></i> Logout</button>
      </div>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div class="topbar-search"><input type="text" id="globalSearchInput" placeholder="Search messages, people, documents…"><div class="search-dropdown" id="globalSearchDropdown"></div></div>
        <div class="notif-wrap">
          <button class="topbar-bell" id="notifBell" aria-label="Notifications"><i class="ti ti-bell"></i><span class="dot" id="notifDot" style="display:none;">0</span></button>
          <div class="notif-dropdown" id="notifDropdown"></div>
        </div>
        <img class="topbar-avatar" id="topbarAvatarImg" src="assets/logo.jpeg" alt="You">
      </div>

      <div class="page-body">
        <h1 class="page-greeting" id="greeting">Hello,</h1>
        <p class="page-greeting-sub" id="greetingSub">—</p>

        <div class="dash-grid">
          <div class="panel">
            <div class="panel-header">
              <h2>Announcements</h2>
            </div>
            <div id="announcementsContainer"><div class="empty-note">Loading announcements…</div></div>
          </div>

          <div class="panel">
            <div class="panel-header"><h2>Quick Actions</h2></div>
            <a href="inbox.html" class="quick-action"><i class="ti ti-mail"></i> Open Inbox</a>
            <a href="leave.html" class="quick-action"><i class="ti ti-calendar-event"></i> Request Leave</a>
            <a href="directory.html" class="quick-action"><i class="ti ti-users"></i> Staff Directory</a>
          </div>
          <div class="panel" id="attendanceCardPanel">
            <div class="panel-header"><h2>Attendance Today</h2></div>
            <div id="attendanceCardBody" style="padding:8px 0;">
              <div class="empty-note">Loading…</div>
            </div>
          </div>
        </div>

        
        <div class="panel" id="pendingStaffPanel" style="display:none; margin-top:20px;">
          <div class="panel-header"><h2>Pending Staff Approvals</h2></div>
          <div id="pendingStaffList"></div>
        </div>

        <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr);">
          <div class="stat-card">
            <div class="num" id="statUnread">—</div>
            <div class="lbl">Unread Messages</div>
          </div>
          <div class="stat-card">
            <div class="num" id="statSecondary">—</div>
            <div class="lbl" id="statSecondaryLabel">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/notifications.js"></script>
  <script src="assets/search.js"></script>
  <script>
    async function init() {
      let staff;
      try {
        const result = await apiRequest('/dashboard-check');
        staff = result.staff;
        document.getElementById('greeting').textContent = `Hello, ${staff.fullName.split(' ')[0]} 👋`;
        document.getElementById('greetingSub').textContent = `${staff.role} · MACDEN`;
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }

      // These four don't depend on each other's results, so run them all
      // at once instead of one after another -- cuts load time from the
      // sum of every call down to roughly the slowest single one.
      await Promise.allSettled([
        (async () => {
          try {
            const unread = await apiRequest('/messages/unread-count');
            document.getElementById('statUnread').textContent = unread.unreadCount;
            if (unread.unreadCount > 0) {
              const badge = document.getElementById('unreadBadge');
              badge.textContent = unread.unreadCount;
              badge.style.display = 'inline-block';
              const dot = document.getElementById('notifDot');
              dot.textContent = unread.unreadCount;
              dot.style.display = 'flex';
            }
          } catch (err) {
            document.getElementById('statUnread').textContent = '0';
          }
        })(),
        (async () => {
          try {
            const result = await apiRequest('/messages/announcements/active');
            renderAnnouncements(result.announcements || []);
          } catch (err) {
            document.getElementById('announcementsContainer').innerHTML =
              '<div class="empty-note">Could not load announcements.</div>';
          }
        })(),
        (async () => {
          const body = document.getElementById('attendanceCardBody');
          try {
            if (staff.role === 'admin') {
              const res = await fetch('/api/attendance/summary-today', { credentials: 'include' });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || 'Could not load.');
              body.innerHTML =
                '<div style="font-family:\'Manrope\',sans-serif; font-weight:800; font-size:28px; color:var(--primary); margin-bottom:2px;">' +
                  data.checkedInCount + ' <span style="font-size:16px; font-weight:600; color:var(--text-secondary);">of ' + data.totalActiveStaff + '</span>' +
                '</div>' +
                '<div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:12px;">staff checked in today</div>' +
                '<a href="attendance-report.html" style="font-size:12.5px; font-weight:600; color:var(--primary); text-decoration:none;">View full report &rarr;</a>';
            } else {
              const res = await fetch('/api/attendance/my-today', { credentials: 'include' });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || 'Could not load.');
              if (data.checkedIn) {
                const time = new Date(data.checkInTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                body.innerHTML =
                  '<div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">' +
                    '<span style="width:32px; height:32px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ti-check" style="color:#fff; font-size:18px;"></i></span>' +
                    '<div><div style="font-size:13px; color:var(--text-primary);">You checked in today</div><div style="font-weight:700; color:var(--primary);">at ' + time + '</div></div>' +
                  '</div>' +
                  '<a href="my-attendance.html" style="font-size:12.5px; font-weight:600; color:var(--primary); text-decoration:none;">View my attendance history &rarr;</a>';
              } else {
                body.innerHTML =
                  '<div style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">You have not checked in yet today.</div>' +
                  '<a href="my-attendance.html" style="font-size:12.5px; font-weight:600; color:var(--primary); text-decoration:none;">View my attendance history &rarr;</a>';
              }
            }
          } catch (err) {
            body.innerHTML = '<div class="empty-note">Could not load attendance.</div>';
          }
        })(),
        (async () => {
          try {
            if (staff.role === 'admin') {
              const pending = await apiRequest('/leave/pending');
              document.getElementById('statSecondary').textContent = pending.requests.length;
              document.getElementById('statSecondaryLabel').textContent = 'Pending Approvals';
            } else {
              const mine = await apiRequest('/leave/mine');
              const pendingCount = mine.requests.filter(r => r.status === 'pending').length;
              document.getElementById('statSecondary').textContent = pendingCount;
              document.getElementById('statSecondaryLabel').textContent = 'My Pending Leave Requests';
            }
          } catch (err) {
            document.getElementById('statSecondary').textContent = '0';
            document.getElementById('statSecondaryLabel').textContent = staff.role === 'admin' ? 'Pending Approvals' : 'My Pending Leave Requests';
          }
        })(),
        loadPendingStaff()
      ]);
    }

    
    async function loadPendingStaff() {
      try {
        const result = await apiRequest('/admin/pending-staff');
        if (result.pending.length === 0) return;

        document.getElementById('pendingStaffPanel').style.display = 'block';
        document.getElementById('pendingStaffList').innerHTML = result.pending.map(p =>
          '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">' +
            '<div><div style="font-size:13.5px; font-weight:600;">' + p.full_name + '</div>' +
            '<div style="font-size:12px; color:var(--text-secondary);">' + p.username + ' · ' + p.email + '</div></div>' +
            '<button class="btn btn-primary" style="width:auto; padding:7px 16px;" onclick="approveStaff(\'' + p.id + '\', this)">Approve</button>' +
          '</div>'
        ).join('');
      } catch (err) {
        // Fail silently -- non-admins will always hit this (403), which is expected
      }
    }

    async function approveStaff(id, btn) {
      btn.disabled = true;
      btn.textContent = 'Approving…';
      try {
        await apiRequest('/admin/approve-staff/' + id, { method: 'POST' });
        // Give the button immediate, guaranteed feedback instead of relying
        // entirely on a second re-fetch (loadPendingStaff) to make it
        // disappear -- if that re-fetch has ANY timing hiccup, the old
        // button used to just sit there stuck forever even though the
        // approval itself had already genuinely succeeded.
        btn.textContent = 'Approved ✓';
        const row = btn.closest('div');
        if (row && row.parentElement) {
          setTimeout(() => row.remove(), 600);
        }
        loadPendingStaff(); // still refresh in the background, for accuracy
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Approve';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await apiRequest('/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    function announcementCardHtml(a){
      const posted = new Date(a.sentAt);
      const postedStr = posted.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
        ' — ' + posted.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      const snippet = (a.body || '').length > 140 ? a.body.slice(0, 140) + '…' : (a.body || '');
      return '<a href="inbox.html?id=' + a.conversationId + '" style="text-decoration:none; display:block; ' +
        'border-left:4px solid var(--primary); background:var(--primary-dim); border-radius:8px; ' +
        'padding:12px 14px; margin-bottom:10px;">' +
        '<div style="font-weight:700; font-size:13.5px; color:var(--text-primary); margin-bottom:3px;">' + a.subject + '</div>' +
        '<div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; line-height:1.4;">' + snippet + '</div>' +
        '<div style="font-size:10.5px; color:var(--text-muted);">Posted ' + postedStr + '</div>' +
        '</a>';
    }

    function renderAnnouncements(items){
      const container = document.getElementById('announcementsContainer');
      const VISIBLE_COUNT = 2;

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-note">No announcements right now.</div>';
        return;
      }

      const visible = items.slice(0, VISIBLE_COUNT);
      const rest = items.slice(VISIBLE_COUNT);

      let html = visible.map(announcementCardHtml).join('');

      if (rest.length > 0) {
        html += '<div id="announcementsRest" style="display:none;">' + rest.map(announcementCardHtml).join('') + '</div>';
        html += '<button id="announcementsToggle" style="width:100%; padding:8px; border:1px solid var(--border); ' +
          'background:var(--surface); border-radius:8px; font-size:12.5px; font-weight:600; color:var(--primary); ' +
          'cursor:pointer; font-family:var(--font-body);">View all (' + items.length + ')</button>';
      }

      container.innerHTML = html;

      const toggleBtn = document.getElementById('announcementsToggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function(){
          const restEl = document.getElementById('announcementsRest');
          const expanded = restEl.style.display === 'block';
          restEl.style.display = expanded ? 'none' : 'block';
          this.textContent = expanded ? 'View all (' + items.length + ')' : 'Show less';
        });
      }
    }

    window.addEventListener('macden:newActivity', () => {
      apiRequest('/messages/announcements/active')
        .then(result => renderAnnouncements(result.announcements || []))
        .catch(() => {});
    });

    init();
  </script>
</body>
</html>
