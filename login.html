<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <body class="login-page hide-login-btn">
        <!---- Nav loadshere -->
        <div id="navbar"></div>

        <!---- LOGIN SECTION  --->
        <section class="login-section">

        <div class="login-card">

           <!--- LOGO  ---->
           <div class="login-logo">
            <img src="images/logo.jpeg" alt="MACDEN LOGO" />
           </div> 

           <!--- Heading  --->
           <h1 class="login-heading">Welcome back. </h1>
           <p class="login-sub">
            Sign in to access live pricing and download your product list.
           </p>

           <!--- FORM --->
           <form class="login-form">

            <div class="form-group">
               <label class="form-label">Email address</label> 
               <input  type="email" class="form-input"
               placeholder="your@email.com" required />
            </div>

            <div class="form-group">
             <label class="form-label">Password</label>
             <input type="password" class="form-input"
             placeholder="Your password" required />
            </div>

            <button type="submit" class="btn primary login-submit">
                Sign in
            </button>

           </form>

           <!-- Footer Link -->
            <div class="login-links">
               <a href="forgot_password.html" class="inline-link">Forgot password</a>
               <span class="login-diver">.</span>
               <a href="register.html" class="inline-link">
                Create an account
               </a>
            </div>
        </div>    


        </section>

        <script src="js/web.js"></script>

    </body>
</body>
</html>
