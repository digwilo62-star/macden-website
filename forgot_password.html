<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - MACDEN </title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page hide-login-btn">

    <!--- Nav loads here --->
   <div id="navbar"></div>
<div id="bottom-nav"></div>

    <!--- FORGOT PASSWORD  ------>
    <section class="login-section">
       
     <div class="login-card">


        <!--- Logo --->
        <div class="login-logo">
          <img src="images/logo.jpeg" alt="MACDEN LOGO" />
          </div>   
          
        <!--- Default state - enter email ---->
        <div id="forgot-form-state">

         <h1 class="login-heading">Forgot your password</h1>
         <p class="login-sub">
            Enter the email address linked to your account and we'll send your a reset link. 
         </p>   

         <form class="login-form" id="forgot-form">

            <div class="form-group">
              <label class="form-label">Email address</label>  
              <input type="email" class="form-input"
              placeholder="your@email.com"
              required id="forgot-email"/>
            </div>

            <button type="submit"
            class="btn primary login-submit">
              send reset link
            </button>

         </form>

        </div>
    
      <!----  Success state - shown after submit  ------>
      <div id="forgot-success-state" style="display:none;">

      <div class="forgot-success-icon">&#10003;</div>
      
      <h1 class="login-heading">Check your email.</h1>
      <p class="login-sub">
        we've sent a password reset link to 
        <strong id="forgot-email-display"></strong>
        Check your inbox and follow the instructions.
      </p>
      <p class="login-sub">
        Didn't get it? Check your spam folder or try again below.
      </p>

      <button class="btn primary login-submit"
        onclick="resetForgotForm()">
       Try a different email
       </button>

      </div>  

     <!--- Back to Login  ----->
      <div class="login-links">
        <a href="login.html" class="inline-link">
            &larr; Back to sign in
        </a>
      </div>

        </div>
     




    </section>

    <script src="js/web.js"></script>
    <script src="js/forgot_password.js"></script>



    
</body>
</html>
