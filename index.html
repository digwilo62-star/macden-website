<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACDEN — Nigerian Beverage Distribution</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page hide-login-btn">

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HERO SECTION -->
    <section class="hero-split">

        <!-- LEFT SIDE -->
        <div class="hero-split-left">

            <div class="hero-logo-block">
                <img src="images/logo.jpeg"
                    alt="MACDEN Logo"
                    class="hero-logo-img" />
            </div>

            <h1 class="hero-split-title">
                Nigeria's bulk beverage supply, done right.
            </h1>

            <p class="hero-split-sub">
                Supplying wines, spirits, beer, malt, and RTD
                products in bulk to retailers, hotels, and
                wholesale buyers across Nigeria.
            </p>

            <div class="hero-split-buttons">
                <button class="btn primary"
                    onclick="window.location='login.html'">
                    Login for best prices
                </button>
                <button class="btn secondary"
                    onclick="window.location='work_with_us.html'">
                    Work with us
                </button>
            </div>

        </div>

        <!-- RIGHT SIDE - CAROUSEL -->
        <div class="hero-split-right">

            <div class="gallery-carousel">

                <!-- Carousel track -->
                <div class="carousel-track" id="carousel-track">
                    <!-- Cards injected by gallery.js -->
                </div>

                <!-- Arrows -->
                <button class="carousel-arrow carousel-arrow--left"
                    id="carousel-prev">
                    &#8592;
                </button>
                <button class="carousel-arrow carousel-arrow--right"
                    id="carousel-next">
                    &#8594;
                </button>

                <!-- Dots -->
                <div class="carousel-dots" id="carousel-dots"></div>

            </div>

        </div>

    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-overlay" id="lightbox-overlay"></div>
        <div class="lightbox-modal">
            <button class="lightbox-close"
                id="lightbox-close">
                &#10005;
            </button>
            <div class="lightbox-img-wrap">
                <img src="" alt=""
                    class="lightbox-img"
                    id="lightbox-img" />
            </div>
            <div class="lightbox-caption"
                id="lightbox-caption"></div>
            <div class="lightbox-nav">
                <button class="lightbox-btn"
                    id="lightbox-prev">
                    &#8592; Prev
                </button>
                <span class="lightbox-counter"
                    id="lightbox-counter"></span>
                <button class="lightbox-btn"
                    id="lightbox-next">
                    Next &#8594;
                </button>
            </div>
        </div>
    </div>

    <!-- GLASS FOOTER -->
    <footer class="glass-footer">
        <div class="glass-footer-container">
            <p class="glass-footer-brand">
                &copy; 2026 MACDEN &mdash;
                Nigerian Beverage Distribution
            </p>
            <ul class="glass-footer-links">
                <li><a href="#">Terms</a></li>
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Cookies</a></li>
            </ul>
        </div>
    </footer>

    <script src="js/gallery.js"></script>
    <script src="js/web.js"></script>

</body>
</html>
